<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDB813" />
      <stop offset="60%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#E28500" />
    </linearGradient>

    <!-- Fresh Left Leaf Gradient -->
    <linearGradient id="leftLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9AD85E" />
      <stop offset="50%" stop-color="#70B836" />
      <stop offset="100%" stop-color="#347C27" />
    </linearGradient>

    <!-- Deep Right Leaf Gradient -->
    <linearGradient id="rightLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80C74E" />
      <stop offset="40%" stop-color="#288349" />
      <stop offset="100%" stop-color="#104D35" />
    </linearGradient>

    <!-- Field Terrace 1 Gradient -->
    <linearGradient id="field1Grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0D3B28" />
      <stop offset="50%" stop-color="#176B45" />
      <stop offset="100%" stop-color="#238B52" />
    </linearGradient>

    <!-- Field Terrace 2 Gradient -->
    <linearGradient id="field2Grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#145237" />
      <stop offset="50%" stop-color="#207A4B" />
      <stop offset="100%" stop-color="#389E5F" />
    </linearGradient>
  </defs>

  <!-- Golden Sun Crescent Arc -->
  <path
    d="M 132 290 C 104 228 116 150 166 102 C 224 46 312 48 368 106 C 392 131 405 162 408 194 C 402 188 394 182 386 177 C 382 148 370 120 348 98 C 298 48 218 46 166 96 C 122 138 110 206 134 262 Z"
    fill="url(#sunGrad)"
  />

  <!-- Main Left Leaf -->
  <path
    d="M 272 295 C 248 250 200 200 160 185 C 158 235 188 278 272 295 Z"
    fill="url(#leftLeafGrad)"
  />
  <path
    d="M 272 295 C 228 255 190 220 160 185 C 200 215 240 260 272 295 Z"
    fill="#C6EF8A"
    opacity="0.6"
  />

  <!-- Main Right Leaf -->
  <path
    d="M 272 295 C 285 240 330 160 420 120 C 430 178 395 248 272 295 Z"
    fill="url(#rightLeafGrad)"
  />
  <path
    d="M 272 295 C 315 230 365 170 420 120 C 375 180 325 245 272 295 Z"
    fill="#8CCB69"
    opacity="0.5"
  />

  <!-- Field Base Furrow 1 (Upper Terrace) -->
  <path
    d="M 95 365 C 130 310 210 275 285 285 C 345 292 395 320 445 370 C 370 340 305 325 235 325 C 170 325 125 345 95 365 Z"
    fill="url(#field1Grad)"
  />

  <!-- Field Base Furrow 2 (Lower Swelling Terrace) -->
  <path
    d="M 185 362 C 265 330 340 340 405 405 C 340 375 275 365 210 380 C 185 385 160 395 135 410 C 145 390 162 374 185 362 Z"
    fill="url(#field2Grad)"
  />
</svg>
